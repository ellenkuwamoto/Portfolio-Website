<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Ellen Kuwamoto Portfolio</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="css/main.css" />
    <link rel="stylesheet" type="text/css" href="css/custom.css" />
    <script type="text/javascript" src="js/jquery.min.js"></script>
    <script type="text/javascript" src="js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="js/main.js"></script>

    <style>
      .grid-container {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }

      @media (max-width: 768px) {
        .grid-container {
          grid-template-columns: 1fr;
        }
      }

      .thumbnail-container {
        position: relative;
        overflow: hidden;
        max-width: 80%; /* Adjust this value as needed */
        margin: auto; /* Center the thumbnails if needed */
      }

      .thumbnail-container img {
        width: 100%;
        display: block;
        object-fit: cover; /* This ensures the image fills the space proportionally */
      }

      .thumbnail-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .thumbnail-container:hover .thumbnail-overlay {
        opacity: 1;
      }

      .thumbnail-overlay p {
        font-size: 18px;
        color: black;
        font-weight: bold;
        text-align: center;
        margin: 0;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <nav class="navbar navbar-expand-sm">
        <div class="navbar-nav">
          <a class="navbar-brand" href="index.html">*Site under construction come back soon* ELLEN KUWAMOTO</a>
          <a class="nav-item nav-link" href="work.html">Work</a>
          <a class="nav-item nav-link" href="about.html">About</a>
        </div>
      </nav>
      <div class="a-divider"></div>
      <main>
        <div class="grid-container">
          <a href="DeadDogu.html" class="thumbnail-container">
            <img 
            id="DeadDoguThumbnail" 
            src="images/DeadDoguThumbnail.png" 
            alt="Dead Dogu thumbnail" />
            <div class="thumbnail-overlay">
              <p>Dead Dogu</p>
            </div>
          </a>
        </div>
      </main>
      <div class="b-divider"></div>
      <footer>
        <p>Contact: ellenkuwamoto@gmail.com</p>
      </footer>
    </div>
  </body>
</html>
