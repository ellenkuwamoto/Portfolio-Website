    <style>
        .grid-container {
          display: grid;
          grid-template-columns: repeat(3, 1fr); /* 3 per row for large screens */
          gap: 20px;
        }
      
        @media (max-width: 992px) {
          .grid-container {
            grid-template-columns: repeat(2, 1fr); /* 2 per row for medium screens */
          }
        }
      
        @media (max-width: 768px) {
          .grid-container {
            grid-template-columns: 1fr; /* 1 per row for small screens */
          }
        }
      
        .thumbnail-container {
          position: relative;
          overflow: hidden;
          max-width: 100%;
          margin: auto;
          cursor: pointer;
        }
      
        .thumbnail-container img {
          width: 100%;
          display: block;
          object-fit: cover;
          transition: opacity 0.3s ease;
        }
      
        /* Hide image on hover */
        .thumbnail-container:hover img {
          opacity: 0;
        }
      </style>
