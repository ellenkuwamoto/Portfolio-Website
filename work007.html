<!DOCTYPE html>
<html lang="en">
  <head>
    <title>work007</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/custom.css" />
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
      }

      .project-container {
  display: flex;
  flex-wrap: wrap;
  gap: 30px; /* space between carousel and info */
}

.project-container > .col-md-6 {
  flex: 1; /* ensures both columns take equal space */
}
      .project-info {
        padding: 20px;
      }

      .project-details {
        margin-bottom: 20px;
      }

      .project-details p {
        margin: 0;
      }

      .project-details strong {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
      }

      .divider {
        border-top: 1px solid #ccc;
        margin: 15px 0;
      }

      footer {
        margin-top: 50px;
        text-align: center;
      }

      /* --- Carousel area --- */
      .carousel-area {
        position: relative;
        width: 100%;
        padding-top: 75%; /* 4:3 aspect ratio */
       
        overflow: hidden;
      }

      #projectCarousel {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        padding: 0 40px; /* space for arrows */
        box-sizing: border-box;
      }

      #projectCarousel .carousel-inner {
        width: 100%;
        height: 100%;
      }

      #projectCarousel .carousel-item {
        position: relative;
        height: 100%;
      }

      #projectCarousel .carousel-item img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        border-radius: 0;
        cursor: pointer;
      }

      /* --- Carousel arrows --- */
      .carousel-control-prev,
      .carousel-control-next {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: auto;
        height: auto;
        background: none;
        border: none;
        font-size: 2rem;
        color: #333;
        z-index: 10;
        cursor: pointer;
      }

      .carousel-control-prev {
        left: 0; /* flush to left edge */
      }

      .carousel-control-next {
        right: 0; /* flush to right edge */
      }
      .carousel-control-prev-icon,
      .carousel-control-next-icon {
        background: none !important; /* remove default arrow */
        width: auto;
        height: auto;
        display: inline-block;
        font-size: 2rem;
        color: #333;
      }
      .carousel-control-prev-icon::after {
        content: '<';
      }

      .carousel-control-next-icon::after {
        content: '>';
      }

      /* --- Lightbox overlay --- */
      .lightbox-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.85);
        justify-content: center;
        align-items: center;
        z-index: 1050;
        padding: 30px;
      }

      .lightbox-overlay.active {
        display: flex;
      }

      .lightbox-image {
        max-width: 90%;
        max-height: 90%;
        object-fit: contain;
        border-radius: 0;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <nav class="navbar navbar-expand-sm">
        <div class="navbar-nav">
          <span class="navbar-brand no-interaction">ELLEN KUWAMOTO</span>
          <a class="nav-item nav-link" href="index.html">Work</a>
          <a class="nav-item nav-link" href="about.html">About</a>
        </div>
      </nav>

      <div class="a-divider"></div>

      <!-- Project Section -->
      <div class="row project-container">
        <!-- Left column: Carousel -->
        <div class="col-md-6">
          <div class="carousel-area">
            <div id="projectCarousel" class="carousel slide" data-bs-ride="false">
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img src="images/work-007-v1.webp" alt="Work 007 view 1" />
                </div>
                <div class="carousel-item">
                  <img src="images/work-007-v2.webp" alt="Work 007 view 2" />
                </div>
              </div>

              <!-- Carousel controls -->
              <button class="carousel-control-prev" type="button" data-bs-target="#projectCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
              </button>
              <button class="carousel-control-next" type="button" data-bs-target="#projectCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
              </button>
            </div>
          </div>
        </div>

        <!-- Right column: Info -->
        <div class="col-md-6 project-info">
          <div class="project-details">
            <strong>Title</strong>
            <p>My Whole World</p>
          </div>
          <div class="divider"></div>

          <div class="project-details">
            <strong>Date</strong>
            <p>2025</p>
          </div>
          <div class="divider"></div>

          <div class="project-details">
            <strong>Size</strong>
            <p>6 x 4 x 4 in</p>
          </div>
          <div class="divider"></div>

          <div class="project-details">
            <strong>Materials</strong>
            <p>Acrylic resin</p>
          </div>
        </div>
      </div>

      <div class="b-divider"></div>

      <!-- Footer -->
      <footer>
        <p>Contact: ellenkuwamoto@gmail.com | efk9495@nyu.edu</p>
      </footer>
    </div>

    <!-- Lightbox Overlay -->
    <div class="lightbox-overlay" id="lightboxOverlay">
      <img class="lightbox-image" id="lightboxImage" src="" alt="Fullscreen view" />
    </div>

    <!-- JS -->
    <script>
      const lightboxOverlay = document.getElementById('lightboxOverlay');
      const lightboxImage = document.getElementById('lightboxImage');
      const carousel = document.getElementById('projectCarousel');

      // Click on carousel image -> show enlarged
      carousel.querySelectorAll('.carousel-item img').forEach(img => {
        img.addEventListener('click', () => {
          lightboxImage.src = img.src;
          lightboxOverlay.classList.add('active');
        });
      });

      // Click on enlarged image -> close
      lightboxImage.addEventListener('click', () => {
        lightboxOverlay.classList.remove('active');
      });

      // Click outside the image also closes overlay
      lightboxOverlay.addEventListener('click', (e) => {
        if (e.target === lightboxOverlay) {
          lightboxOverlay.classList.remove('active');
        }
      });
    </script>
  </body>
</html>
